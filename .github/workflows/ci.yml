name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS runner: the whisper-rs "metal" feature is enabled unconditionally
    # in Cargo.toml, so Linux runners can't build this crate.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test

# kotoma model catalog — the single source of truth for `kotoma model`.
# Embedded into the binary at build time, so `kotoma update` ships the latest
# catalog. Add an entry here to make a model pullable; no code change needed.
#
# role: "asr"        → whisper.cpp ggml model (sets top-level model_path)
#       "translator" → llama.cpp GGUF chat model (sets [translator] model_path)

[[model]]
name = "whisper-small"
role = "asr"
file = "ggml-small.bin"
sha256 = "1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b"
url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin"
size = "~500 MB"
note = "standard tier — fast, lower accuracy"

[[model]]
name = "whisper-large-v3-turbo"
role = "asr"
file = "ggml-large-v3-turbo.bin"
sha256 = "1fc70f774d38eb169993ac391eea357ef47c88757ef72ee5943879b7e8e2bc69"
url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo.bin"
size = "~1.6 GB"
note = "high tier — best ASR accuracy"

[[model]]
name = "whisper-large-v3-turbo-q5_0"
role = "asr"
file = "ggml-large-v3-turbo-q5_0.bin"
sha256 = "394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2"
url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin"
size = "~574 MB"
note = "turbo accuracy, ~1/3 the size — much cooler/faster, tiny quality loss"

[[model]]
name = "whisper-large-v3-turbo-q8_0"
role = "asr"
file = "ggml-large-v3-turbo-q8_0.bin"
sha256 = "317eb69c11673c9de1e1f0d459b253999804ec71ac4c23c17ecf5fbe24e259a1"
url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q8_0.bin"
size = "~874 MB"
note = "turbo accuracy, half the size — cooler with near-zero quality loss"

[[model]]
name = "gemma-4-e4b"
role = "translator"
file = "gemma-4-E4B-it-Q4_K_M.gguf"
sha256 = "90ce98129eb3e8cc57e62433d500c97c624b1e3af1fcc85dd3b55ad7e0313e9f"
url = "https://huggingface.co/ggml-org/gemma-4-E4B-it-GGUF/resolve/main/gemma-4-E4B-it-Q4_K_M.gguf"
size = "~5.3 GB"
note = "standard tier — improved JA ↔ EN stability, comfortable on 8–16 GB Macs"

[[model]]
name = "gemma-4-12b"
role = "translator"
file = "gemma-4-12B-it-Q4_K_M.gguf"
sha256 = "1278394b693672ac2799eadc9a83fd98259a6a88a40acfb1dcaa6c6fc895a606"
url = "https://huggingface.co/ggml-org/gemma-4-12B-it-GGUF/resolve/main/gemma-4-12B-it-Q4_K_M.gguf"
size = "~7.4 GB"
note = "high tier — best JA ↔ EN accuracy, needs ~16 GB RAM"

# Presets bundle one ASR + one translator model. `kotoma model preset <name>`
# pulls them and points the config at them. `both` installs every preset.
[preset.standard]
models = ["whisper-small", "gemma-4-e4b"]

[preset.high]
models = ["whisper-large-v3-turbo", "gemma-4-12b"]
